[project]
name = "vietnam-job-aggregator"
version = "0.1.0"
description = "Vietnam Job Aggregator & Skill Intelligence Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "datasets>=2.19.0",
    "torch>=2.2.0",
    "accelerate>=0.29.0",
    "bitsandbytes>=0.43.0",
    "seqeval",
    "scikit-learn",
    "pandas",
    "requests",
    "beautifulsoup4>=4.12",
    "lxml",
    "httpx>=0.27",
    "playwright",
    "python-dotenv",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
